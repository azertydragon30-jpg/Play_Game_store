<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake | Play Game Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background-color: #000; color: #fff; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
        }
        .score-board { font-size: 2rem; color: #0fa; text-shadow: 0 0 10px #0fa; margin-bottom: 10px; }
        canvas { border: 4px solid #0fa; background-color: #0d0d1a; box-shadow: 0 0 20px rgba(0, 255, 170, 0.5); }
        #game-over {
            position: absolute; display: none; flex-direction: column;
            align-items: center; background: rgba(13, 13, 26, 0.95);
            padding: 30px; border: 2px solid #f0f; border-radius: 15px;
            text-align: center; box-shadow: 0 0 30px #f0f;
        }
        .btn-restart {
            margin-top: 20px; padding: 10px 25px; background: #0fa;
            color: #000; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="score-board">SCORE: <span id="currentScore">0</span></div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <div id="game-over">
        <h2 style="color:#f0f; font-size:3rem;">GAME OVER</h2>
        <p>Score final : <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="resetGame()">Recommencer</button>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('currentScore');
        const gameOverScreen = document.getElementById('game-over');
        const box = 20;
        let score, snake, food, d, gameLoop;
        let gameStarted = false; // Empêche la mort au lancement

        function init() {
            snake = [{x: 9 * box, y: 10 * box}, {x: 8 * box, y: 10 * box}, {x: 7 * box, y: 10 * box}];
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            d = undefined;
            score = 0;
            gameStarted = false;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, 100);
        }

        window.addEventListener("keydown", (e) => {
            // BLOQUE LE SCROLL de la page avec les flèches
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if(e.keyCode == 37 && d != "RIGHT") { d = "LEFT"; gameStarted = true; }
            else if(e.keyCode == 38 && d != "DOWN") { d = "UP"; gameStarted = true; }
            else if(e.keyCode == 39 && d != "LEFT") { d = "RIGHT"; gameStarted = true; }
            else if(e.keyCode == 40 && d != "UP") { d = "DOWN"; gameStarted = true; }
        });

        function draw() {
            ctx.fillStyle = "#0d0d1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i=0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#0fa" : "#008f5d";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }

            ctx.fillStyle = "#f0f";
            ctx.fillRect(food.x, food.y, box, box);

            if(!gameStarted) {
                ctx.fillStyle = "white";
                ctx.fillText("APPUYEZ SUR UNE FLÈCHE", 120, 200);
                return;
            }

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreDisplay.innerText = score;
                food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
            } else {
                snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            // Vérifie la mort seulement si on bouge
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                clearInterval(gameLoop);
                document.getElementById('finalScore').innerText = score;
                gameOverScreen.style.display = 'flex';
            }

            snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i=0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function resetGame() { init(); }
        init();
    </script>
</body>
</html>
