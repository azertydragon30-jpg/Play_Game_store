<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Brick Breaker | Play Game Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { 
            background-color: #000; color: #fff; 
            display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden;
        }
        .ui { margin-bottom: 15px; text-align: center; }
        .score { font-size: 2rem; color: #f0f; text-shadow: 0 0 10px #f0f; }
        canvas { border: 4px solid #f0f; background: #0d0d1a; box-shadow: 0 0 20px rgba(255, 0, 255, 0.3); }
        
        #game-over {
            position: absolute; display: none; flex-direction: column;
            align-items: center; background: rgba(13, 13, 26, 0.95);
            padding: 30px; border: 2px solid #0fa; border-radius: 15px;
            box-shadow: 0 0 30px #0fa; text-align: center;
        }
        .btn {
            margin-top: 20px; padding: 10px 25px; background: #f0f;
            color: #fff; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ui">
        <div class="score">SCORE: <span id="scoreVal">0</span></div>
    </div>

    <canvas id="brickCanvas" width="600" height="400"></canvas>

    <div id="game-over">
        <h2 id="status" style="font-size: 3rem; color: #0fa;">BRAVO !</h2>
        <p>Score final : <span id="finalScore">0</span></p>
        <button class="btn" onclick="location.reload()">Rejouer</button>
    </div>

    <script>
        const canvas = document.getElementById("brickCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("scoreVal");

        // Paramètres du jeu
        let ballRadius = 8;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 3;
        let dy = -3;
        
        let paddleHeight = 12;
        let paddleWidth = 90;
        let paddleX = (canvas.width - paddleWidth) / 2;
        
        let rightPressed = false;
        let leftPressed = false;

        // Briques
        let brickRowCount = 5;
        let brickColumnCount = 7;
        let brickWidth = 70;
        let brickHeight = 20;
        let brickPadding = 10;
        let brickOffsetTop = 40;
        let brickOffsetLeft = 30;
        let score = 0;

        let bricks = [];
        for(let c=0; c<brickColumnCount; c++) {
            bricks[c] = [];
            for(let r=0; r<brickRowCount; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }

        // Contrôles
        window.addEventListener("keydown", (e) => {
            if(e.key == "Right" || e.key == "ArrowRight") { rightPressed = true; e.preventDefault(); }
            else if(e.key == "Left" || e.key == "ArrowLeft") { leftPressed = true; e.preventDefault(); }
        });
        document.addEventListener("keyup", (e) => {
            if(e.key == "Right" || e.key == "ArrowRight") rightPressed = false;
            else if(e.key == "Left" || e.key == "ArrowLeft") leftPressed = false;
        });

        function collisionDetection() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    let b = bricks[c][r];
                    if(b.status == 1) {
                        if(x > b.x && x < b.x+brickWidth && y > b.y && y < b.y+brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score++;
                            scoreDisplay.innerText = score;
                            if(score == brickRowCount*brickColumnCount) {
                                endGame(true);
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#fff";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0fa";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#0fa";
            ctx.fill();
            ctx.closePath();
        }

        function drawBricks() {
            for(let c=0; c<brickColumnCount; c++) {
                for(let r=0; r<brickRowCount; r++) {
                    if(bricks[c][r].status == 1) {
                        let brickX = (c*(brickWidth+brickPadding))+brickOffsetLeft;
                        let brickY = (r*(brickHeight+brickPadding))+brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = `hsl(${r * 40}, 100%, 50%)`;
                        ctx.shadowBlur = 5;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        function endGame(win) {
            document.getElementById("game-over").style.display = "flex";
            document.getElementById("status").innerText = win ? "VICTOIRE !" : "GAME OVER";
            document.getElementById("status").style.color = win ? "#0fa" : "#f00";
            document.getElementById("finalScore").innerText = score;
            dx = 0; dy = 0;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawBall();
            drawPaddle();
            collisionDetection();

            // Rebond murs
            if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) dx = -dx;
            if(y + dy < ballRadius) dy = -dy;
            else if(y + dy > canvas.height-ballRadius) {
                if(x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                    // Accélération légère
                    dx *= 1.05;
                    dy *= 1.05;
                }
                else {
                    endGame(false);
                }
            }

            if(rightPressed && paddleX < canvas.width-paddleWidth) paddleX += 7;
            else if(leftPressed && paddleX > 0) paddleX -= 7;

            x += dx;
            y += dy;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
