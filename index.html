<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game Store | Votre Univers Gaming</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d1a; color: #fff; overflow-x: hidden; }

        /* EFFETS DE LUMIÈRE NÉON */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 10px #fff, 0 0 21px #fff, 0 0 42px #0fa, 0 0 82px #0fa, 0 0 92px #0fa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header {
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #0fa;
            box-shadow: 0 0 15px #0fa;
        }

        /* ZONE DE JEU */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
            padding: 20px;
        }

        canvas {
            background-color: #000;
            border: 3px solid #f0f;
            box-shadow: 0 0 20px #f0f;
            max-width: 100%;
        }

        .controls {
            margin-top: 20px;
            color: #0fa;
            font-style: italic;
        }

        footer {
            height: 15vh;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="neon-text">Play Game Store</h1>
        <p>Le carrefour de vos aventures numériques</p>
    </header>

    <main id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            Utilisez les flèches du clavier pour déplacer le bloc !
        </div>
    </main>

    <footer>
        &copy; 2026 Play Game Store - Tous droits réservés.
    </footer>

    <script>
        // LOGIQUE DU JEU (Initialisation)
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Variables de notre premier bloc interactif
        let player = {
            x: 280,
            y: 180,
            size: 40,
            color: '#0fa',
            speed: 5
        };

        function drawPlayer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Efface l'écran
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
        }

        function update() {
            drawPlayer();
            requestAnimationFrame(update);
        }

        // Écouteur de touches
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowUp') player.y -= player.speed;
            if(e.key === 'ArrowDown') player.y += player.speed;
            if(e.key === 'ArrowLeft') player.x -= player.speed;
            if(e.key === 'ArrowRight') player.x += player.speed;

            // Limites du canvas
            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
        });

        update();
    </script>
</body>
</html>
