<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game Store | Hub de Jeux</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d1a; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }

        /* EFFETS NÉON */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 21px #0fa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header {
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #0fa;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d1a 100%);
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ZONE DE JEU PRINCIPALE (L'ÉCRAN DE JEU) */
        #game-viewport {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: #000;
            border: 4px solid #0fa;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.4);
            display: none; 
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
        }

        .game-controls {
            background: #16213e;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #0fa;
        }

        /* BOUTONS */
        .fullscreen-btn {
            background: #f0f;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px #f0f;
        }
        .fullscreen-btn:hover { background: #fff; color: #f0f; box-shadow: 0 0 20px #fff; }

        /* GRILLE DES JEUX */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .game-card {
            background: #16213e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            position: relative;
        }

        .game-card:hover { 
            border-color: #0fa; 
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0, 250, 170, 0.2);
        }

        .btn-play {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #0fa;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-play:hover { background: #fff; transform: scale(1.05); }

        footer { text-align: center; padding: 60px 20px; color: #444; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1 class="neon-text">Play Game Store</h1>
        <p>Le carrefour de vos aventures numériques</p>
    </header>

    <main class="container">

        <section id="game-viewport">
            <div id="game-content">
                </div>
            <div class="game-controls">
                <span id="current-game-title" style="font-weight: bold; color: #0fa;">PRÊT À JOUER ?</span>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">PLEIN ÉCRAN ⛶</button>
            </div>
        </section>

        <h2>🔥 Les hits du moment</h2>
        <div class="games-grid">
            
            <div class="game-card">
                <div style="font-size: 3rem; margin-bottom: 10px;">⚡</div>
                <h3>Neon Strike</h3>
                <p>Par LeCyberCreateur</p>
                <div class="btn-play" onclick="loadGame('https://lecybercreateur.github.io/Neon-Strike.html/', 'Neon Strike')">LANCER</div>
            </div>

            <div class="game-card">
                <div style="font-size: 3rem; margin-bottom: 10px;">🐍</div>
                <h3>Cyber Snake</h3>
                <p>Nouveau Mode Amélioré</p>
                <div class="btn-play" onclick="loadGame('snake.html', 'Cyber Snake')">LANCER</div>
            </div>

            <div class="game-card" style="opacity: 0.6;">
                <div style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
                <h3>Prochain Défi</h3>
                <p>Arrive bientôt...</p>
                <div class="btn-play" style="background: #333; cursor: default;">BIENTÔT</div>
            </div>
        </div>

    </main>

    <footer>
        &copy; 2026 Play Game Store - Développé par la communauté.
    </footer>

    <script>
        const viewport = document.getElementById('game-viewport');
        const gameContent = document.getElementById('game-content');
        const gameTitle = document.getElementById('current-game-title');

        function loadGame(url, title) {
            viewport.style.display = 'block';
            gameTitle.innerText = title;
            
            // On utilise systématiquement une iframe maintenant que tout est séparé
            gameContent.innerHTML = `<iframe src="${url}" id="game-frame" allowfullscreen></iframe>`;
            
            // Scroll fluide vers la zone de jeu
            window.scrollTo({ top: viewport.offsetTop - 50, behavior: 'smooth' });
        }

        function toggleFullScreen() {
            const frame = document.getElementById('game-frame');
            if (!frame) return;

            if (!document.fullscreenElement) {
                viewport.requestFullscreen().catch(err => {
                    alert(`Erreur: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
