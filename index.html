<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game Store | Hub de Jeux</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d1a; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }

        /* EFFETS NÉON */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 21px #0fa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header {
            height: 18vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #0fa;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0d0d1a 100%);
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
            position: relative;
        }

        /* BARRE D'AUTHENTIFICATION */
        .auth-bar {
            position: absolute;
            top: 10px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .auth-btn {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #0fa;
            background: transparent;
            color: #0fa;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: #0fa;
            color: #000;
        }

        .user-info {
            display: none; /* Caché par défaut */
            align-items: center;
            gap: 10px;
        }

        .user-photo {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #f0f;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ZONE DE JEU PRINCIPALE */
        #game-viewport {
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            background: #000;
            border: 4px solid #0fa;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.4);
            display: none; 
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            display: block;
        }

        .game-controls {
            background: #16213e;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #0fa;
        }

        .fullscreen-btn {
            background: #f0f;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px #f0f;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .game-card {
            background: #16213e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .game-card:hover { 
            border-color: #0fa; 
            transform: translateY(-8px);
        }

        .btn-play {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: #0fa;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        footer { text-align: center; padding: 60px 20px; color: #444; }
    </style>
</head>
<body>

    <header>
        <div class="auth-bar">
            <div id="logged-out-ui">
                <button class="auth-btn" onclick="loginGoogle()">Connexion Google</button>
            </div>
            <div id="logged-in-ui" class="user-info">
                <img id="user-avatar" class="user-photo" src="" alt="Avatar">
                <span id="user-name">Joueur</span>
                <button class="auth-btn" style="border-color: #f0f; color: #f0f;" onclick="logout()">Déconnexion</button>
            </div>
        </div>
        <h1 class="neon-text">Play Game Store</h1>
        <p>Le carrefour de vos aventures numériques</p>
    </header>

    <main class="container">
        <section id="game-viewport">
            <div id="game-content"></div>
            <div class="game-controls">
                <span id="current-game-title" style="font-weight: bold; color: #0fa;">PRÊT À JOUER ?</span>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">PLEIN ÉCRAN ⛶</button>
            </div>
        </section>

        <h2>🔥 Les hits du moment</h2>
        <div class="games-grid">
            <div class="game-card">
                <h3>Neon Strike</h3>
                <p>Par LeCyberCreateur</p>
                <div class="btn-play" onclick="loadGame('https://lecybercreateur.github.io/Neon-Strike.html/', 'Neon Strike')">LANCER</div>
            </div>

            <div class="game-card">
                <h3>Cyber Snake</h3>
                <p>Nouveau Mode Amélioré</p>
                <div class="btn-play" onclick="loadGame('snake.html', 'Cyber Snake')">LANCER</div>
            </div>
        </div>
    </main>

    <footer>&copy; 2026 Play Game Store</footer>

    <script>
        // CONFIGURATION FIREBASE (À remplacer par tes infos Firebase Console)
        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_PROJET.firebaseapp.com",
            projectId: "TON_PROJET_ID",
            storageBucket: "TON_PROJET.appspot.com",
            messagingSenderId: "TON_ID",
            appId: "TON_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        // ÉLÉMENTS UI
        const loggedOutUI = document.getElementById('logged-out-ui');
        const loggedInUI = document.getElementById('logged-in-ui');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');

        // FONCTIONS AUTH
        function loginGoogle() {
            auth.signInWithPopup(provider).catch(error => console.log(error));
        }

        function logout() {
            auth.signOut();
        }

        // SURVEILLER L'ÉTAT DE CONNEXION
        auth.onAuthStateChanged(user => {
            if (user) {
                loggedOutUI.style.display = 'none';
                loggedInUI.style.display = 'flex';
                userAvatar.src = user.photoURL;
                userName.innerText = user.displayName;
                console.log("Connecté en tant que :", user.uid);
            } else {
                loggedOutUI.style.display = 'block';
                loggedInUI.style.display = 'none';
            }
        });

        // LOGIQUE VIEWPORT
        const viewport = document.getElementById('game-viewport');
        const gameContent = document.getElementById('game-content');
        const gameTitle = document.getElementById('current-game-title');

        function loadGame(url, title) {
            viewport.style.display = 'block';
            gameTitle.innerText = title;
            gameContent.innerHTML = `<iframe src="${url}" id="game-frame" allowfullscreen></iframe>`;
            window.scrollTo({ top: viewport.offsetTop - 50, behavior: 'smooth' });
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                viewport.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
