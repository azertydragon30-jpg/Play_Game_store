<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game Store | Gaming Hub</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d1a; color: #fff; overflow-x: hidden; scroll-behavior: smooth; }

        /* EFFETS NÉON */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 7px #fff, 0 0 21px #0fa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header {
            height: 15vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #0fa;
            background: #1a1a2e;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ZONE DE JEU PRINCIPALE (L'ÉCRAN DE JEU) */
        #game-viewport {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background: #000;
            border: 4px solid #0fa;
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.3);
            display: none; /* Caché par défaut jusqu'au clic */
        }

        iframe, canvas {
            width: 100%;
            height: 500px;
            border: none;
            display: block;
        }

        .game-controls {
            background: #16213e;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #0fa;
        }

        /* BOUTON PLEIN ÉCRAN */
        .fullscreen-btn {
            background: #f0f;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }
        .fullscreen-btn:hover { background: #fff; color: #f0f; }

        /* GRILLE DES JEUX */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .game-card {
            background: #16213e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .game-card:hover { border-color: #0fa; transform: scale(1.02); }

        .btn-play {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: #0fa;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        footer { text-align: center; padding: 40px; color: #555; }
    </style>
</head>
<body>

    <header>
        <h1 class="neon-text">Play Game Store</h1>
        <p>Le carrefour de vos aventures numériques</p>
    </header>

    <main class="container">

        <section id="game-viewport">
            <div id="game-content">
                </div>
            <div class="game-controls">
                <span id="current-game-title">Sélectionnez un jeu</span>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">PLEIN ÉCRAN ⛶</button>
            </div>
        </section>

        <h2>🔥 Jeux du moment</h2>
        <div class="games-grid">
            <div class="game-card">
                <h3>Neon Strike</h3>
                <p>Par CyberCreateur</p>
                <div class="btn-play" onclick="loadGame('https://lecybercreateur.github.io/Neon-Strike.html/', 'Neon Strike', true)">LANCER</div>
            </div>

            <div class="game-card">
                <h3>Cyber Snake</h3>
                <p>Action Rapide</p>
                <div class="btn-play" onclick="loadGame('https://azertydragon30-jpg.github.io/Play_Game_store/snake.html', 'Cyber Snake', false)">LANCER</div>
            </div>
        </div>

    </main>

    <footer>
        &copy; 2026 Play Game Store - Tous droits réservés.
    </footer>

    <script>
        const viewport = document.getElementById('game-viewport');
        const gameContent = document.getElementById('game-content');
        const gameTitle = document.getElementById('current-game-title');

        function loadGame(url, title, isExternal) {
            viewport.style.display = 'block';
            gameTitle.innerText = title;
            window.scrollTo(0, viewport.offsetTop - 20);

            if (isExternal) {
                // Charge le jeu externe dans une iframe
                gameContent.innerHTML = `<iframe src="${url}" id="game-frame"></iframe>`;
            } else if (url === 'snake') {
                // Charge ton code Snake local
                gameContent.innerHTML = `<canvas id="snakeCanvas" width="400" height="400"></canvas>`;
                startSnake();
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                viewport.requestFullscreen().catch(err => {
                    alert(`Erreur plein écran: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // LOGIQUE DU SERPENT (simplifiée pour l'intégration)
        function startSnake() {
            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            let box = 20;
            let snake = [{x: 9 * box, y: 10 * box}];
            let d;
            
            document.addEventListener("keydown", (e) => {
                if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
                if(e.keyCode == 38 && d != "DOWN") d = "UP";
                if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
                if(e.keyCode == 40 && d != "UP") d = "DOWN";
            });

            function draw() {
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                for(let i=0; i<snake.length; i++) {
                    ctx.fillStyle = "#0fa";
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                }
                let snakeX = snake[0].x;
                let snakeY = snake[0].y;
                if(d == "LEFT") snakeX -= box;
                if(d == "UP") snakeY -= box;
                if(d == "RIGHT") snakeX += box;
                if(d == "DOWN") snakeY += box;
                let newHead = {x: snakeX, y: snakeY};
                snake.unshift(newHead);
                snake.pop();
            }
            setInterval(draw, 100);
        }
    </script>
</body>
</html>
