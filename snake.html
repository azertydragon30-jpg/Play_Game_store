<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Snake | Play Game Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: #000; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden;
        }

        #ui {
            margin-bottom: 20px;
            text-align: center;
        }

        .score-board {
            font-size: 2rem;
            color: #0fa;
            text-shadow: 0 0 10px #0fa;
            font-weight: bold;
        }

        canvas {
            border: 4px solid #0fa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
            background-color: #0d0d1a;
        }

        #game-over {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            background: rgba(13, 13, 26, 0.9);
            padding: 30px;
            border: 2px solid #f0f;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px #f0f;
        }

        #game-over h2 { color: #f0f; font-size: 3rem; margin-bottom: 10px; }
        
        .btn-restart {
            margin-top: 20px;
            padding: 10px 25px;
            background: #0fa;
            color: #000;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="score-board">SCORE: <span id="currentScore">0</span></div>
    </div>

    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <div id="game-over">
        <h2>GAME OVER</h2>
        <p>Ton score final : <span id="finalScore">0</span></p>
        <button class="btn-restart" onclick="resetGame()">Recommencer</button>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('currentScore');
        const finalScoreDisplay = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('game-over');

        const box = 20;
        let score = 0;
        let gameSpeed = 100;
        let snake, food, d, gameLoop;

        function init() {
            snake = [{x: 9 * box, y: 10 * box}];
            food = spawnFood();
            d = undefined;
            score = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.style.display = 'none';
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(draw, gameSpeed);
        }

        function spawnFood() {
            return {
                x: Math.floor(Math.random() * 19 + 1) * box,
                y: Math.floor(Math.random() * 19 + 1) * box
            };
        }

        document.addEventListener("keydown", (e) => {
            if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
            else if(e.keyCode == 38 && d != "DOWN") d = "UP";
            else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
            else if(e.keyCode == 40 && d != "UP") d = "DOWN";
        });

        function draw() {
            ctx.fillStyle = "#0d0d1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessiner le serpent
            for(let i=0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? "#0fa" : "#008f5d";
                ctx.shadowBlur = (i === 0) ? 15 : 0;
                ctx.shadowColor = "#0fa";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                ctx.strokeStyle = "#000";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }

            // Dessiner la nourriture
            ctx.fillStyle = "#f0f";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#f0f";
            ctx.beginPath();
            ctx.arc(food.x + box/2, food.y + box/2, box/2.5, 0, Math.PI*2);
            ctx.fill();

            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            if(d == "LEFT") snakeX -= box;
            if(d == "UP") snakeY -= box;
            if(d == "RIGHT") snakeX += box;
            if(d == "DOWN") snakeY += box;

            // Collision nourriture
            if(snakeX == food.x && snakeY == food.y) {
                score++;
                scoreDisplay.innerText = score;
                food = spawnFood();
            } else {
                if(d) snake.pop();
            }

            let newHead = {x: snakeX, y: snakeY};

            // Mort : Murs ou Soi-même
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                endGame();
            }

            if(d) snake.unshift(newHead);
        }

        function collision(head, array) {
            for(let i=0; i < array.length; i++) {
                if(head.x == array[i].x && head.y == array[i].y) return true;
            }
            return false;
        }

        function endGame() {
            clearInterval(gameLoop);
            finalScoreDisplay.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            init();
        }

        init();
    </script>
</body>
</html>
